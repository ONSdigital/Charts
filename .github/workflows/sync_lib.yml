name: Sync lib folder

on:
  push:
    branches: ['main']
    paths: ['lib/**']
  workflow_dispatch:

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source repository for lib
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        path: source-repo
    
    - name: Checkout target repository for charts-lib
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ONSdigital/charts-lib
        token: ${{ secrets.SYNC_LIB }}
        fetch-depth: 0
        path: charts-lib

    - name: Checkout target repository for otherCharts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ONSdigital/otherCharts
        token: ${{ secrets.SYNC_LIB }}
        fetch-depth: 0
        path: otherCharts

    - name: Checkout target repository for maps
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ONSdigital/Maps
        token: ${{ secrets.SYNC_MAPS_LIB }}
        fetch-depth: 0
        path: Maps
    
    - name: Clear existing lib folders in target repo
      run: |
        # Clear lib folder
        find charts-lib -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

        rm -rf otherCharts/lib
        mkdir -p otherCharts/lib

        rm -rf Maps/lib
        mkdir -p Maps/lib
    
    - name: Copy files to target repo (excluding GitHub Actions)
      run: |
        # Copy
        rsync -av --exclude='.git' --exclude='.github' source-repo/lib/ charts-lib/
        mkdir -p charts-lib/.github
        rsync -av source-repo/.github/CODEOWNERS charts-lib/.github/CODEOWNERS
        rsync -av --exclude='.git' --exclude='.github' source-repo/lib/ otherCharts/lib/
        rsync -av --exclude='.git' --exclude='.github' source-repo/lib/ Maps/lib/
    
    - name: Commit and push changes to charts-lib
      run: |
        cd charts-lib
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all changes
        git add --all
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit to charts-lib"
        else
          git commit -m "Sync from lib: ${{ github.sha }}"
          git pull --rebase origin main
          git push
        fi

    - name: Commit and push changes to otherCharts
      run: |
        cd otherCharts
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all changes
        git add lib/
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit to otherCharts"
        else
          git commit -m "Sync from lib: ${{ github.sha }}"
          git pull --rebase origin main
          git push
        fi

    - name: Commit and push changes to Maps
      run: |
        cd Maps
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all changes
        git add lib/
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit to Maps"
        else
          git commit -m "Sync from lib: ${{ github.sha }}"
          git pull --rebase origin main
          git push
        fi
    
