name: Render README

on:
  push:
    branches: [main]

concurrency:
  group: repo-write-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.BYPASS_RULESET_DEPLOY_KEY }}
      
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Install rmarkdown
        run: |
          install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Render README.Rmd
        run: |
          rmarkdown::render("README.Rmd")
        shell: Rscript {0}

      - name: Commit rendered README.md
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md       
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Render README.md from README.Rmd"
            git pull --rebase origin main
            git push
          fi
