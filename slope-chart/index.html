<!DOCTYPE html>
<html lang="en">

<head>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700' rel='stylesheet' type='text/css'>
    <title>Slope chart</title>

    <meta name="template" content="slope-chart">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="googlebot" content="indexifembedded" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <link rel="stylesheet" href="./chart.css" />
</head>

<body>

    <h5 id="accessibleSummary" class="visuallyhidden"></h5>

    <div aria-hidden="true" id="legend"></div>
    <div id="graphic" aria-hidden="true">
        <!-- <img src="fallback.png" alt="[Chart]" /> -->
    </div>

    <div id="debug-output" style="position: fixed; top: 0; right: 0; width: 300px; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.9); color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; z-index: 10000; display: none;">Debug Log</div>

    <h5 id="source">
    </h5>

    <script src="https://cdn.ons.gov.uk/vendor/d3/6.3.0/d3.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.js" type="text/javascript"></script>
    <script src="../lib/colours.js"></script>
    <script src="./config.js"></script>
    <script src="./script.js" type="module"></script>
    <script>
        window.debugLog = [];
        window.logDebug = function(msg) {
            window.debugLog.push(msg);
            const div = document.getElementById('debug-output');
            if (div) {
                div.innerHTML += msg + '<br>';
                div.scrollTop = div.scrollHeight;
            }
        };
        document.addEventListener('DOMContentLoaded', function() {
            const div = document.getElementById('debug-output');
            div.style.display = 'block';
        });
    </script>

</body>

</html>
